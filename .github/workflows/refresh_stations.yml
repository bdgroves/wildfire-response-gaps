name: Monthly Stations Refresh

# OSM fire station data changes slowly. Refresh once a month, at 4am Pacific
# on the 1st, so it's already cached before the daily workflow needs it.

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch: {}

concurrency:
  group: wildfire-stations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch OSM stations
        run: python python/fetch_stations.py

      - name: Commit stations.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/stations.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: monthly OSM stations refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
