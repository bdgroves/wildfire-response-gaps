name: Update YTD Wildfire Map

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ytd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install R packages
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")
          pak::pak(c(
            "sf",
            "tidyverse",
            "osmdata",
            "tigris",
            "httr",
            "jsonlite",
            "ggrepel",
            "ggspatial",
            "cowplot",
            "patchwork",
            "scales",
            "maps",
            "systemfonts",
            "textshaping",
            "ragg"
          ))
        shell: Rscript {0}

      - name: Run YTD update
        run: Rscript R/update_ytd_ci.R

      - name: Check for changes
        id: check_changes
        run: |
          git add output/figures/ytd_natgeo.png output/ytd_summary.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to YTD map"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "YTD map updated"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "YTD map update $(date +'%Y-%m-%d')"
          git push
